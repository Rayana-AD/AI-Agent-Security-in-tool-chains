[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-harness"
version = "0.1.0"
description = "Biomimetic Fold-Gate-Cleave AI safety harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2,<1",
    "pydantic>=2.0,<3",
    "transformers>=4.46,<5",
    "torch>=2.0,<3",
    "datasets>=2.14,<4",
    "pyyaml>=6.0,<7",
    "numpy>=1.24,<3",
    "tqdm>=4.65,<5",
    "sentence-transformers>=2.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0,<9"]
agentdojo = ["agentdojo>=0.1.27,<1", "redis>=5.0,<6", "fakeredis>=2.26,<3"]
supplement-live = [
    "agentdojo>=0.1.27,<1",
    "python-dotenv>=1.0,<2",
    "together>=1.2,<2",
    "nltk>=3.8,<4",
    "google-api-core>=2.19,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
