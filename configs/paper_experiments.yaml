    use_unidirectional_gate: true
    use_state_partition: true
    use_cleave: false
    use_elastic: false
    use_provenance_tagger: true
    provenance_model_path: models/provenance_tagger_v2_mlp.json
    provenance_block_threshold: 0.20
    use_reflection_probe: true
    reflection_block_threshold: 0.40
    reflection_dot_dim: 64
    provenance_carry_decay_streak: 3
    provenance_carry_tiered: true
    use_carry_store: true
    carry_store_backend: redis
    agentdojo_ipi_output_mode: metadata_strip
    provenance_reflection_watch_carveout: false
    provenance_ipi_light_state: true
    provenance_per_tool_filter: true
    provenance_task_fidelity_hint: true
