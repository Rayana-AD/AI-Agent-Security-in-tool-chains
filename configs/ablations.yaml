experiments:
  exp_a_shuffle:
    description: "想法2 — Schema + Shuffle补充 vs 仅Schema（测分片嵌入/语义欺骗）"
    configs: [full, ablation_1, idea2_only, baseline_1]
    attack_types: [fragmented_intra, fragmented_cross, mhj_temporal, deception]
    include_benign: true

  exp_b_channel:
    description: "想法1 — 单向通道+状态分区 vs 自由跳转（测状态污染/回流套利）"
    configs: [full, ablation_2, idea1_only, baseline_1]
    attack_types: [state_pollution, retry_abuse]
    include_benign: true

  factorial_2x2:
    description: "2×2 因子 — Shuffle × 单向分区"
    configs: [full, idea1_only, idea2_only, baseline_1]
    attack_types: null
    include_benign: true

  exp_c1_drattack:
    description: "P0 Exp-C1 DrAttack/DRA 分解-重组攻击"
    configs: [idea2_only, schema_only, ablation_1, full]
    dataset: c1_drattack
    include_benign: false

  exp_c2_cross_node:
